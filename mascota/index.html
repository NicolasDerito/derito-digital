<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>El carpincho que te atiende 24/7 - Derito Digital</title>
<style>
  :root{--fondo:#F6F3EC;--terracota:#C4643F;--tinta:#3A2A22;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 34%, #FFFCF7 0%, var(--fondo) 58%, #EBE4D7 100%)}
  .marca{position:fixed;top:0;left:0;right:0;z-index:6;padding:18px 22px;display:flex;align-items:center;gap:9px;
    font-weight:800;letter-spacing:1.6px;font-size:12px;opacity:.62}
  .punto{width:9px;height:9px;border-radius:50%;background:var(--terracota);box-shadow:0 0 0 4px rgba(196,100,63,.15)}
  .escena{position:fixed;inset:0;display:grid;place-items:center;perspective:1200px;z-index:2}
  .cuerpo{position:relative;transform-style:preserve-3d;transition:transform .15s ease-out;
    animation:flotar 4.6s ease-in-out infinite;will-change:transform}
  @keyframes flotar{0%,100%{translate:0 0}50%{translate:0 -18px}}
  img.mascota{display:block;width:min(76vw,400px);height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;
    -webkit-mask-image:radial-gradient(closest-side,#000 74%,rgba(0,0,0,.55) 88%,rgba(0,0,0,0) 100%);
    mask-image:radial-gradient(closest-side,#000 74%,rgba(0,0,0,.55) 88%,rgba(0,0,0,0) 100%);
    filter:drop-shadow(0 30px 40px rgba(120,70,50,.22))}
  .aura{position:absolute;left:50%;top:48%;width:118%;height:118%;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,178,.55) 0%,rgba(255,214,178,0) 66%);z-index:-1;
    animation:aura 4.6s ease-in-out infinite}
  @keyframes aura{0%,100%{opacity:.5;scale:1}50%{opacity:.85;scale:1.06}}
  .respira{animation:respira 5.2s ease-in-out infinite}
  @keyframes respira{0%,100%{scale:1}50%{scale:1.014}}
  .boing{animation:boing .52s cubic-bezier(.24,1.5,.42,1)}
  @keyframes boing{0%{scale:1 1}28%{scale:1.09 .9}58%{scale:.95 1.06}100%{scale:1 1}}
  .mira{animation:mira 1.5s ease-in-out}
  @keyframes mira{0%,100%{rotate:0deg}30%{rotate:-3.2deg}70%{rotate:3.2deg}}
  .sombra{position:fixed;left:50%;bottom:15%;width:min(64vw,330px);height:34px;margin-left:calc(min(64vw,330px)/-2);
    border-radius:50%;z-index:1;background:radial-gradient(ellipse at center,rgba(120,80,60,.30),rgba(120,80,60,0) 70%);
    filter:blur(4px);animation:sombraViva 4.6s ease-in-out infinite}
  @keyframes sombraViva{0%,100%{scale:1;opacity:.9}50%{scale:.85;opacity:.6}}
  .globo{position:fixed;z-index:6;left:50%;top:8%;transform:translateX(-50%);max-width:min(88vw,440px);
    background:#fff;border-radius:18px;padding:14px 18px;font-size:15px;line-height:1.35;text-align:center;
    box-shadow:0 10px 30px rgba(58,42,34,.13);transition:opacity .3s}
  .globo:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:3px}
  .globo.oculto{opacity:0;pointer-events:none}
  .pie{position:fixed;z-index:6;left:0;right:0;bottom:14px;text-align:center;font-size:12.5px;opacity:.6}
  .panel{position:fixed;z-index:9;left:50%;bottom:0;transform:translateX(-50%);width:min(94vw,470px);background:#fff;
    border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(58,42,34,.2);display:flex;flex-direction:column;max-height:60vh;transition:transform .35s ease}
  .panel.oculto{transform:translateX(-50%) translateY(112%)}
  .cab{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid #F0E7DC;font-size:14px}
  .cab .est{display:flex;align-items:center;gap:8px}
  .cab .dot{width:8px;height:8px;border-radius:50%;background:#38B000}
  .cab button{border:0;background:#F4EDE4;width:28px;height:28px;border-radius:9px;font-size:15px;cursor:pointer;color:#6B5548}
  .msgs{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:9px;font-size:14.5px;line-height:1.4}
  .m{max-width:82%;padding:9px 13px;border-radius:14px;white-space:pre-wrap}
  .m.ag{background:#F6EFE6;border-bottom-left-radius:5px;align-self:flex-start}
  .m.yo{background:var(--terracota);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
  form{display:flex;gap:9px;padding:12px 14px;border-top:1px solid #F0E7DC}
  form input{flex:1;border:1px solid #E6DACB;border-radius:12px;padding:12px 13px;font-size:15px;outline:none;background:#FCF9F5}
  form button{border:0;background:var(--terracota);color:#fff;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="marca"><span class="punto"></span>DERITO DIGITAL</div>
<div id="globo" class="globo">Hola! Soy el carpincho que atiende esta web. Tocalo y te contesto.</div>
<div class="sombra"></div>
<div class="escena">
  <div id="cuerpo" class="cuerpo respira">
    <span class="aura"></span>
    <img class="mascota" src="capi.png" alt="Carpincho agente de Derito Digital" draggable="false"/>
  </div>
</div>
<div class="pie">El carpincho ES el agente - tocalo para hablarle</div>
<div id="panel" class="panel oculto">
  <div class="cab"><span class="est"><span class="dot"></span><b>Agente Derito</b></span><button id="cerrar" type="button">x</button></div>
  <div id="msgs" class="msgs"><div class="m ag">Hola! Contame de tu negocio y te digo que te conviene.</div></div>
  <form id="form"><input id="txt" placeholder="Escribi tu consulta..." autocomplete="off"/><button type="submit">Enviar</button></form>
</div>
<script>
var cuerpo = document.getElementById('cuerpo');
var panel = document.getElementById('panel');
var globo = document.getElementById('globo');
var msgs = document.getElementById('msgs');
var form = document.getElementById('form');
var txt = document.getElementById('txt');
var sid = 'web-' + Math.random().toString(36).slice(2, 9);
var abierto = false;

function mover(e){
  var p = e.touches ? e.touches[0] : e;
  if (!p) return;
  var nx = (p.clientX / window.innerWidth) * 2 - 1;
  var ny = (p.clientY / window.innerHeight) * 2 - 1;
  cuerpo.style.transform = 'rotateX(' + (-ny * 10).toFixed(1) + 'deg) rotateY(' + (nx * 16).toFixed(1) + 'deg) translateX(' + (nx * 13).toFixed(1) + 'px) translateY(' + (ny * 7).toFixed(1) + 'px)';
}
document.addEventListener('pointermove', mover);
document.addEventListener('touchmove', mover, { passive: true });
document.addEventListener('pointerdown', function(e){
  if (e.target.closest('#panel')) return;
  cuerpo.classList.remove('boing'); void cuerpo.offsetWidth; cuerpo.classList.add('boing');
  alternar();
});
document.getElementById('cerrar').addEventListener('click', function(e){ e.stopPropagation(); if (abierto) alternar(); });
function alternar(){
  abierto = !abierto;
  panel.classList.toggle('oculto', !abierto);
  globo.classList.toggle('oculto', abierto);
  if (abierto) setTimeout(function(){ txt.focus(); }, 350);
}
setInterval(function(){
  if (abierto) return;
  cuerpo.classList.remove('mira'); void cuerpo.offsetWidth; cuerpo.classList.add('mira');
}, 8000);
form.addEventListener('submit', function(e){
  e.preventDefault();
  var v = txt.value.trim(); if (!v) return;
  txt.value = '';
  agregar(v, 'yo');
  var ult = agregar('...', 'ag');
  fetch('https://chat.deritodigital.com.ar/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session: sid, message: v})})
    .then(function(r){ return r.json(); })
    .then(function(j){ ult.textContent = (j && j.reply) ? j.reply : '(sin respuesta)'; msgs.scrollTop = msgs.scrollHeight; })
    .catch(function(){ ult.textContent = '(no pude conectar con el agente)'; });
});
function agregar(t, q){
  var d = document.createElement('div');
  d.className = 'm ' + q; d.textContent = t;
  msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
  return d;
}
</script>
</body>
</html>
